name: Build and Release Antigravity Mobile APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AntigravityMobile-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main'
      with:
        tag_name: v1.0.0-${{ github.run_number }}
        name: Antigravity Mobile v1.0.0 (Build #${{ github.run_number }})
        body: |
          ### ⚡ Antigravity Mobile APK
          Сборка агентской среды Antigravity для Android.
          
          **Что включено:**
          - Автономный агент Gemini с системным промптом для управления файлами и Git
          - Поддержка выполнения команд через `/`
          - Конвейер сборки APK прямо на устройстве (AAPT2 + ECJ + D8)
          - Интерфейс в стиле Google Antigravity Desktop
          
          **Установка:**
          Скачайте `app-debug.apk` ниже и установите на смартфон.
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
